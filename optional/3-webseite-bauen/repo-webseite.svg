<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Repository und Webseite</title>
  <desc id="d">Links das Repository auf GitHub: deine Markdown-Texte, die Vorlage für Menü und Design und das Programm, das Claude geschrieben hat. Bei jedem Push baut das Programm daraus fertige HTML-Seiten. Rechts die Webseite unter dein-name.github.io: Startseite und Über-Seite mit Menü, so wie Besucher sie im Browser sehen.</desc>
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C80F6"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#081523"/>

  <!-- Trennlinie -->
  <line x1="430" y1="24" x2="430" y2="376" stroke="#244054" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Repository -->
  <text x="40" y="44" fill="#F3F7FC" font-size="18" font-weight="700">Repository</text>
  <text x="40" y="66" fill="#B8C9D8" font-size="13">auf GitHub · hier arbeitest du</text>

  <rect x="40" y="86" width="300" height="250" rx="8" fill="#172C40"/>
  <g font-family="JetBrains Mono, Menlo, monospace" font-size="14">
    <!-- Texte -->
    <rect x="60" y="106" width="10" height="26" fill="#48C6F2"/>
    <text x="82" y="124" fill="#F3F7FC">index.md</text>
    <rect x="60" y="142" width="10" height="26" fill="#48C6F2"/>
    <text x="82" y="160" fill="#F3F7FC">über.md</text>
    <text x="210" y="142" fill="#B8C9D8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12">deine Texte</text>
    <!-- Vorlage -->
    <rect x="60" y="188" width="10" height="26" fill="#7594AA"/>
    <text x="82" y="206" fill="#F3F7FC">vorlage/</text>
    <text x="210" y="206" fill="#B8C9D8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12">Menü, Design</text>
    <!-- Programm -->
    <rect x="56" y="234" width="268" height="80" rx="6" fill="none" stroke="#8C80F6" stroke-width="2"/>
    <text x="72" y="264" fill="#F3F7FC">programm</text>
    <text x="72" y="292" fill="#8C80F6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5">geschrieben von Claude</text>
  </g>

  <!-- Bauen -->
  <path d="M324 274 C 380 274, 400 210, 486 210" fill="none" stroke="#8C80F6" stroke-width="2.5" marker-end="url(#pfeil)"/>
  <rect x="362" y="232" width="136" height="22" rx="11" fill="#081523"/>
  <text x="430" y="248" fill="#8C80F6" font-size="12.5" text-anchor="middle">baut bei jedem Push</text>

  <!-- Webseite -->
  <text x="500" y="44" fill="#F3F7FC" font-size="18" font-weight="700">Webseite</text>
  <text x="500" y="66" fill="#B8C9D8" font-size="13">online · das sehen alle</text>

  <!-- Browserfenster -->
  <rect x="500" y="86" width="320" height="250" rx="8" fill="#172C40" stroke="#53C995" stroke-width="2"/>
  <circle cx="518" cy="104" r="4" fill="#7594AA"/>
  <circle cx="532" cy="104" r="4" fill="#7594AA"/>
  <circle cx="546" cy="104" r="4" fill="#7594AA"/>
  <rect x="562" y="94" width="242" height="20" rx="10" fill="#081523"/>
  <text x="574" y="108" fill="#B8C9D8" font-family="JetBrains Mono, Menlo, monospace" font-size="11">dein-name.github.io/projekt</text>
  <line x1="500" y1="124" x2="820" y2="124" stroke="#244054"/>

  <!-- Menü -->
  <text x="520" y="150" fill="#53C995" font-size="13" font-weight="700">Start</text>
  <text x="568" y="150" fill="#B8C9D8" font-size="13">Über</text>
  <line x1="520" y1="160" x2="800" y2="160" stroke="#244054"/>

  <!-- Inhalt -->
  <text x="520" y="190" fill="#F3F7FC" font-size="17" font-weight="700">Segeltörn Kroatien</text>
  <rect x="520" y="204" width="270" height="8" rx="4" fill="#7594AA" opacity="0.6"/>
  <rect x="520" y="220" width="240" height="8" rx="4" fill="#7594AA" opacity="0.6"/>
  <rect x="520" y="236" width="255" height="8" rx="4" fill="#7594AA" opacity="0.6"/>
  <path d="M520 312 L560 284 L590 296 L630 262 L670 280 L710 256 L750 274 L790 250" fill="none" stroke="#53C995" stroke-width="2"/>
  <circle cx="630" cy="262" r="3.5" fill="#53C995"/>
  <circle cx="710" cy="256" r="3.5" fill="#53C995"/>

  <text x="660" y="362" fill="#B8C9D8" font-size="12" text-anchor="middle">fertige HTML-Seiten</text>
  <text x="190" y="362" fill="#B8C9D8" font-size="12" text-anchor="middle">Markdown, Vorlage, Programm</text>
</svg>
