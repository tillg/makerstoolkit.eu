<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Das Kontextfenster füllt sich</title>
  <desc id="d">Drei Runden eines Gesprächs. In jeder Runde kommen Nachricht, gelesene Dateien und Antwort dazu. In Runde 3 passt nicht mehr alles ins Kontextfenster. Darunter ein Projektordner mit sechs Dateien, von denen Claude nur zwei gelesen hat.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7594AA" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="860" height="480" fill="#081523"/>

  <!-- Kontextfenster -->
  <text x="24" y="30" fill="#F3F7FC" font-size="17" font-weight="700">Das Kontextfenster füllt sich – Runde für Runde</text>
  <rect x="130" y="48" width="520" height="164" rx="6" fill="#172C40"/>
  <line x1="650" y1="42" x2="650" y2="218" stroke="#F4B860" stroke-width="2"/>
  <text x="646" y="234" fill="#F4B860" font-size="11.5" text-anchor="end">Grenze des Kontextfensters</text>

  <g font-size="13" fill="#B8C9D8">
    <text x="24" y="82">Runde 1</text>
    <text x="24" y="135">Runde 2</text>
    <text x="24" y="188">Runde 3</text>
  </g>

  <!-- Runde 1 -->
  <g transform="translate(0,62)">
    <rect x="130" width="80" height="30" fill="#8C80F6"/>
    <rect x="210" width="36" height="30" fill="#F4B860"/>
    <rect x="246" width="50" height="30" fill="#53C995"/>
  </g>
  <!-- Runde 2 -->
  <g transform="translate(0,115)">
    <rect x="130" width="80" height="30" fill="#8C80F6"/>
    <rect x="210" width="36" height="30" fill="#F4B860"/>
    <rect x="246" width="50" height="30" fill="#53C995"/>
    <rect x="296" width="36" height="30" fill="#F4B860"/>
    <rect x="332" width="130" height="30" fill="#48C6F2"/>
    <rect x="462" width="50" height="30" fill="#53C995"/>
  </g>
  <!-- Runde 3 -->
  <g transform="translate(0,168)">
    <rect x="130" width="80" height="30" fill="#8C80F6"/>
    <rect x="210" width="36" height="30" fill="#F4B860"/>
    <rect x="246" width="50" height="30" fill="#53C995"/>
    <rect x="296" width="36" height="30" fill="#F4B860"/>
    <rect x="332" width="130" height="30" fill="#48C6F2"/>
    <rect x="462" width="50" height="30" fill="#53C995"/>
    <rect x="512" width="36" height="30" fill="#F4B860"/>
    <rect x="548" width="102" height="30" fill="#48C6F2"/>
    <rect x="650" width="78" height="30" fill="url(#hatch)" stroke="#7594AA" stroke-dasharray="4 3"/>
    <text x="740" y="13" fill="#F3F7FC" font-size="12.5" font-weight="600">passt nicht</text>
    <text x="740" y="28" fill="#F3F7FC" font-size="12.5" font-weight="600">mehr hinein</text>
  </g>

  <!-- Legende -->
  <g font-size="12.5" fill="#B8C9D8" transform="translate(130,262)">
    <rect width="14" height="14" rx="2" fill="#8C80F6"/><text x="20" y="11.5">Systemprompt + CLAUDE.md</text>
    <rect x="210" width="14" height="14" rx="2" fill="#F4B860"/><text x="230" y="11.5">deine Nachricht</text>
    <rect x="356" width="14" height="14" rx="2" fill="#48C6F2"/><text x="376" y="11.5">gelesene Datei</text>
    <rect x="494" width="14" height="14" rx="2" fill="#53C995"/><text x="514" y="11.5">Claudes Antwort</text>
  </g>

  <!-- Projektordner -->
  <line x1="24" y1="300" x2="836" y2="300" stroke="#244054"/>
  <text x="24" y="330" fill="#F3F7FC" font-size="17" font-weight="700">Liegt im Ordner ≠ hat Claude gelesen</text>
  <rect x="24" y="346" width="812" height="110" rx="8" fill="none" stroke="#244054"/>
  <text x="40" y="370" fill="#7594AA" font-size="12" font-family="JetBrains Mono, Menlo, monospace">mein-projekt/</text>

  <g font-size="12" font-family="JetBrains Mono, Menlo, monospace">
    <g transform="translate(40,386)">
      <rect width="118" height="34" rx="5" fill="#172C40" stroke="#48C6F2" stroke-width="1.6"/>
      <text x="59" y="21" fill="#F3F7FC" text-anchor="middle">index.md</text>
      <text x="59" y="52" fill="#48C6F2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif">gelesen</text>
    </g>
    <g transform="translate(172,386)">
      <rect width="118" height="34" rx="5" fill="#172C40" stroke="#48C6F2" stroke-width="1.6"/>
      <text x="59" y="21" fill="#F3F7FC" text-anchor="middle">wetter.md</text>
      <text x="59" y="52" fill="#48C6F2" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif">gelesen</text>
    </g>
    <g transform="translate(304,386)" opacity=".55">
      <rect width="118" height="34" rx="5" fill="none" stroke="#7594AA" stroke-dasharray="4 3"/>
      <text x="59" y="21" fill="#B8C9D8" text-anchor="middle">hafen.pdf</text>
    </g>
    <g transform="translate(436,386)" opacity=".55">
      <rect width="118" height="34" rx="5" fill="none" stroke="#7594AA" stroke-dasharray="4 3"/>
      <text x="59" y="21" fill="#B8C9D8" text-anchor="middle">kosten.xlsx</text>
    </g>
    <g transform="translate(568,386)" opacity=".55">
      <rect width="118" height="34" rx="5" fill="none" stroke="#7594AA" stroke-dasharray="4 3"/>
      <text x="59" y="21" fill="#B8C9D8" text-anchor="middle">crew.md</text>
    </g>
    <g transform="translate(700,386)" opacity=".55">
      <rect width="118" height="34" rx="5" fill="none" stroke="#7594AA" stroke-dasharray="4 3"/>
      <text x="59" y="21" fill="#B8C9D8" text-anchor="middle">route.md</text>
    </g>
  </g>
  <text x="304" y="438" fill="#7594AA" font-size="12">nicht gelesen – Claude weiß nicht, was drinsteht</text>
</svg>
